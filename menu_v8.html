<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banderillas Trucsi - Menú Digital</title>
  
  <!-- Fuente estilo K-Style / Asia Neón -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: #1f2833;
      --neon-green: #39ff14;
      --neon-pink: #ff007f;
      --neon-yellow: #ffee00;
      --text-color: #f0f0f0;
      --text-muted: #c5c6c7;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Poppins', sans-serif;
      padding-bottom: 120px;
    }

    /* ENCABEZADO ESTILO COREANO NEÓN */
    header {
      text-align: center;
      padding: 24px 16px;
      background: linear-gradient(180deg, rgba(31, 40, 51, 0.9) 0%, rgba(11, 12, 16, 1) 100%);
      border-bottom: 2px solid var(--neon-green);
      box-shadow: 0 0 15px rgba(57, 255, 20, 0.3);
    }

    header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      color: var(--neon-green);
      text-shadow: 0 0 8px var(--neon-green), 0 0 18px var(--neon-green);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    header p {
      font-size: 0.9rem;
      color: var(--neon-pink);
      text-shadow: 0 0 5px var(--neon-pink);
      margin-top: 4px;
      font-weight: 600;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }

    /* SECCIONES DESPLEGABLES (ACORDEÓN) */
    .section-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      color: var(--neon-yellow);
      text-shadow: 0 0 5px var(--neon-yellow);
      margin: 20px 0 12px 0;
      text-transform: uppercase;
      border-left: 4px solid var(--neon-yellow);
      padding: 8px 12px;
      background-color: rgba(31, 40, 51, 0.6);
      border-radius: 0 8px 8px 0;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
      transition: background-color 0.2s ease;
    }

    .section-title:hover {
      background-color: rgba(31, 40, 51, 0.9);
    }

    .section-arrow {
      font-size: 0.9rem;
      transition: transform 0.3s ease;
      color: var(--neon-yellow);
    }

    .section-title.collapsed .section-arrow {
      transform: rotate(-90deg);
    }

    .section-content {
      overflow: hidden;
      transition: max-height 0.3s ease-out;
      max-height: 2000px;
    }

    .section-content.collapsed {
      max-height: 0 !important;
    }

    /* TARJETAS DE PRODUCTOS CON ÍCONO */
    .product-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      transition: border-color 0.2s ease;
    }

    .product-icon {
      font-size: 2.2rem;
      background-color: rgba(11, 12, 16, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 54px;
      height: 54px;
    }

    .product-details {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .product-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }

    .product-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
    }

    .product-price {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--neon-green);
      text-shadow: 0 0 4px rgba(57, 255, 20, 0.5);
    }

    .product-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.3;
      margin-bottom: 12px;
    }

    .product-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .btn-add {
      background-color: transparent;
      color: var(--neon-pink);
      border: 2px solid var(--neon-pink);
      border-radius: 8px;
      padding: 8px 14px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 5px rgba(255, 0, 127, 0.3);
      transition: all 0.2s ease;
    }

    .btn-add:active {
      background-color: var(--neon-pink);
      color: #fff;
      box-shadow: 0 0 12px var(--neon-pink);
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--neon-green);
      border-radius: 8px;
      padding: 4px 8px;
      box-shadow: 0 0 8px rgba(57, 255, 20, 0.2);
    }

    .btn-qty {
      background-color: var(--card-bg);
      color: var(--neon-green);
      border: 1px solid var(--neon-green);
      border-radius: 6px;
      width: 28px;
      height: 28px;
      font-weight: 800;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .btn-qty:active {
      background-color: var(--neon-green);
      color: #000;
    }

    .qty-value {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      min-width: 20px;
      text-align: center;
    }

    /* BARRA RESUMEN INFERIOR */
    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: #121212;
      border-top: 2px solid var(--neon-green);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.8);
      z-index: 100;
    }

    .cart-info {
      display: flex;
      flex-direction: column;
    }

    .cart-count {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .cart-total {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--neon-green);
    }

    .btn-view-cart {
      background-color: var(--neon-green);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 10px var(--neon-green);
    }

    .btn-view-cart:disabled {
      background-color: #444;
      color: #888;
      box-shadow: none;
      cursor: not-allowed;
    }

    /* MODAL DE RESUMEN DE PEDIDO */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 200;
      justify-content: center;
      align-items: flex-end;
      backdrop-filter: blur(4px);
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background-color: #12161f;
      border-top: 2px solid var(--neon-pink);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 600px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
      box-shadow: 0 -5px 25px rgba(255, 0, 127, 0.4);
      animation: slideUp 0.25s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-color);
    }

    .modal-title {
      font-family: 'Orbitron', sans-serif;
      color: var(--neon-pink);
      font-size: 1.2rem;
      text-shadow: 0 0 5px var(--neon-pink);
    }

    .btn-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      font-weight: bold;
      cursor: pointer;
    }

    .modal-body {
      overflow-y: auto;
      padding: 16px 0;
      flex-grow: 1;
    }

    .modal-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
    }

    .modal-item-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .modal-item-name {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .modal-item-subtotal {
      font-size: 0.85rem;
      color: var(--neon-green);
    }

    /* CAMPO DE NOTAS PERSONALIZADAS */
    .notes-section {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .notes-label {
      font-size: 0.85rem;
      color: var(--neon-yellow);
      font-weight: 600;
    }

    .notes-textarea {
      width: 100%;
      height: 70px;
      background-color: #0b0c10;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-color);
      padding: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.85rem;
      resize: none;
      outline: none;
    }

    .notes-textarea:focus {
      border-color: var(--neon-yellow);
      box-shadow: 0 0 5px rgba(255, 238, 0, 0.3);
    }

    .modal-footer {
      border-top: 1px solid var(--border-color);
      padding-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.2rem;
      font-weight: 700;
    }

    .modal-total-price {
      color: var(--neon-green);
      font-size: 1.4rem;
      text-shadow: 0 0 5px rgba(57, 255, 20, 0.5);
    }

    .btn-send-whatsapp {
      background-color: #25d366;
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 12px rgba(37, 211, 102, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }

    .btn-send-whatsapp:active {
      background-color: #1eb857;
    }
  </style>
</head>
<body>

  <header>
    <h1>Banderillas Trucsi</h1>
    <p>korean street food</p>
  </header>

  <main class="container">
    <!-- SECCIÓN BANDERILLAS -->
    <div class="section-title" onclick="toggleSection('banderillas-content', this)">
      <span>Banderillas</span>
      <span class="section-arrow">&#9660;</span>
    </div>
    <div id="banderillas-content" class="section-content">
      <div id="banderillas-container"></div>
    </div>

    <!-- SECCIÓN BEBIDAS -->
    <div class="section-title" onclick="toggleSection('bebidas-content', this)">
      <span>Bebidas</span>
      <span class="section-arrow">&#9660;</span>
    </div>
    <div id="bebidas-content" class="section-content">
      <div id="bebidas-container"></div>
    </div>
  </main>

  <div class="cart-bar">
    <div class="cart-info">
      <span id="cart-count" class="cart-count">0 productos seleccionados</span>
      <span id="cart-total" class="cart-total">$0 MXN</span>
    </div>
    <button id="btn-cart" class="btn-view-cart" onclick="openModal()" disabled>Ver Pedido</button>
  </div>

  <!-- MODAL DE RESUMEN DEL PEDIDO -->
  <div id="cart-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">Tu Pedido</span>
        <button class="btn-close" onclick="closeModal()">&times;</button>
      </div>

      <div id="modal-body" class="modal-body"></div>

      <div class="notes-section">
        <label for="order-notes" class="notes-label">Notas o personalización:</label>
        <textarea id="order-notes" class="notes-textarea" placeholder="Ej: Sin mostaza, refresco sabor Coca, té sabor verde..." oninput="saveNotes(this.value)"></textarea>
      </div>

      <div class="modal-footer">
        <div class="modal-total-row">
          <span>Total:</span>
          <span id="modal-total-price" class="modal-total-price">$0 MXN</span>
        </div>
        <button class="btn-send-whatsapp" onclick="sendToWhatsApp()">
          📱 Confirmar y Enviar por WhatsApp
        </button>
      </div>
    </div>
  </div>

  <script>
    const PHONE_NUMBER = "523318698996";

    // BASE DE DATOS DE 8 PRODUCTOS CON ÍCONOS
    const menuData = [
      { id: 1, categoria: "banderilla", icono: "🌭", nombre: "Banderilla Clásica", precio: 35, descripcion: "Salchicha con queso frita, con cátsup, mostaza y crema." },
      { id: 2, categoria: "banderilla", icono: "🔥", nombre: "Banderilla Oji", precio: 40, descripcion: "Salchicha y queso, envuelta en chilito Flamin' Hot, con chile Valentina y mostaza." },
      { id: 3, categoria: "banderilla", icono: "🥔", nombre: "Banderilla Ram", precio: 40, descripcion: "Queso y salchicha empanizada con cuadros de papa; lleva aderezo, crema y chile Valentina." },
      { id: 4, categoria: "banderilla", icono: "✨", nombre: "Banderilla Trucsi", precio: 45, descripcion: "Salchicha y queso con trozos de papa a preferencia, con chile, crema y mostaza." },
      { id: 5, categoria: "banderilla", icono: "🍜", nombre: "Banderilla Rem", precio: 110, descripcion: "Salchicha y queso servida en vaso grande con Maruchan, queso de mesa, mostaza, cátsup, Valentina y queso amarillo derretido." },
      { id: 8, categoria: "banderilla", icono: "🧀", nombre: "Banderilla Sencilla", precio: 30, descripcion: "Solo salchicha o queso frita con cátsup y aderezos tradicionales." },
      { id: 6, categoria: "bebida", icono: "🥤", nombre: "Refrescos (720 ml)", precio: 25, descripcion: "Coca-Cola, Squirt, Mirinda, Manzanita." },
      { id: 7, categoria: "bebida", icono: "🍵", nombre: "Tés Coreanos Tradicionales", precio: 20, descripcion: "Variedad de tés típicos de Corea." }
    ];

    let cart = {};
    let orderNotes = "";

    function toggleSection(contentId, titleElement) {
      const content = document.getElementById(contentId);
      content.classList.toggle('collapsed');
      titleElement.classList.toggle('collapsed');
    }

    function renderMenu() {
      const banderillasContainer = document.getElementById('banderillas-container');
      const bebidasContainer = document.getElementById('bebidas-container');

      banderillasContainer.innerHTML = '';
      bebidasContainer.innerHTML = '';

      menuData.forEach(prod => {
        const qty = cart[prod.id] || 0;

        const actionHTML = qty === 0 
          ? `<button class="btn-add" onclick="updateQuantity(${prod.id}, 1)">+ Agregar</button>`
          : `
            <div class="qty-controls">
              <button class="btn-qty" onclick="updateQuantity(${prod.id}, -1)">-</button>
              <span class="qty-value">${qty}</span>
              <button class="btn-qty" onclick="updateQuantity(${prod.id}, 1)">+</button>
            </div>
          `;

        const cardHTML = `
          <div class="product-card">
            <div class="product-icon">${prod.icono}</div>
            <div class="product-details">
              <div class="product-header">
                <span class="product-title">${prod.nombre}</span>
                <span class="product-price">$${prod.precio}</span>
              </div>
              <p class="product-desc">${prod.descripcion}</p>
              <div class="product-actions">
                ${actionHTML}
              </div>
            </div>
          </div>
        `;

        if (prod.categoria === 'banderilla') {
          banderillasContainer.innerHTML += cardHTML;
        } else {
          bebidasContainer.innerHTML += cardHTML;
        }
      });
    }

    function updateQuantity(productId, change) {
      const currentQty = cart[productId] || 0;
      const newQty = currentQty + change;

      if (newQty > 0) {
        cart[productId] = newQty;
      } else {
        delete cart[productId];
      }

      renderMenu();
      updateCartBar();
      renderModalContent();

      if (Object.keys(cart).length === 0) {
        closeModal();
      }
    }

    function updateCartBar() {
      let totalCount = 0;
      let totalPrice = 0;

      for (const id in cart) {
        const qty = cart[id];
        const product = menuData.find(p => p.id === parseInt(id));
        if (product) {
          totalCount += qty;
          totalPrice += product.precio * qty;
        }
      }

      document.getElementById('cart-count').textContent = `${totalCount} ${totalCount === 1 ? 'producto' : 'productos'}`;
      document.getElementById('cart-total').textContent = `$${totalPrice} MXN`;

      const btnCart = document.getElementById('btn-cart');
      if (totalCount > 0) {
        btnCart.removeAttribute('disabled');
      } else {
        btnCart.setAttribute('disabled', 'true');
      }
    }

    function saveNotes(text) {
      orderNotes = text;
    }

    function openModal() {
      renderModalContent();
      document.getElementById('order-notes').value = orderNotes;
      document.getElementById('cart-modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('cart-modal').classList.remove('active');
    }

    function renderModalContent() {
      const modalBody = document.getElementById('modal-body');
      modalBody.innerHTML = '';

      let totalPrice = 0;

      for (const id in cart) {
        const qty = cart[id];
        const product = menuData.find(p => p.id === parseInt(id));

        if (product) {
          const subtotal = product.precio * qty;
          totalPrice += subtotal;

          modalBody.innerHTML += `
            <div class="modal-item">
              <div class="modal-item-info">
                <span class="modal-item-name">${product.icono} ${product.nombre}</span>
                <span class="modal-item-subtotal">$${product.precio} c/u &bull; Subtotal: $${subtotal}</span>
              </div>
              <div class="qty-controls">
                <button class="btn-qty" onclick="updateQuantity(${product.id}, -1)">-</button>
                <span class="qty-value">${qty}</span>
                <button class="btn-qty" onclick="updateQuantity(${product.id}, 1)">+</button>
              </div>
            </div>
          `;
        }
      }

      document.getElementById('modal-total-price').textContent = `$${totalPrice} MXN`;
    }

    function sendToWhatsApp() {
      let text = "🌭 *NUEVO PEDIDO - BANDERILLAS TRUCSI* 🌭\n\n";
      let totalPrice = 0;

      for (const id in cart) {
        const qty = cart[id];
        const product = menuData.find(p => p.id === parseInt(id));

        if (product) {
          const subtotal = product.precio * qty;
          totalPrice += subtotal;
          text += `• ${qty}x ${product.nombre} ($${subtotal} MXN)\n`;
        }
      }

      if (orderNotes.trim() !== "") {
        text += `\n📝 *Notas/Personalización:*\n"${orderNotes.trim()}"\n`;
      }

      text += `\n💰 *TOTAL A PAGAR: $${totalPrice} MXN*`;

      const encodedText = encodeURIComponent(text);
      const whatsappUrl = `https://wa.me/${PHONE_NUMBER}?text=${encodedText}`;

      window.open(whatsappUrl, '_blank');
    }

    renderMenu();
    updateCartBar();
  </script>
</body>
</html>
